name: Build APK

on:
  push:
    branches: [ "main", "master" ]  # mainまたはmasterブランチにプッシュしたときに自動で動く

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Java（JDK）のセットアップ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Android SDKのセットアップ（パラメータ名を修正！）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 3. gradlewに実行権限をあたえる
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Android SDKなどのビルド環境を整えてAPKを作る
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug  # デバッグ用APKを作る場合

      # 5. 作ったAPKファイルをGitHubからダウンロードできるように保存する
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geppocl-apk
          path: app/build/outputs/apk/debug/app-debug.apk