name: Build and Release Debug APK

on:
  push:
    branches: [ "main", "master" ]  # mainまたはmasterにプッシュしたときに自動で動く！

jobs:
  build:
    runs-on: ubuntu-latest

    # ★ここから追加：Releasesを書き換える権限をあたえる！
    permissions:
      contents: write
    # ★ここまで

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Java（JDK）のセットアップ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Android SDKのセットアップ
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 3. gradlewに実行権限をあたえる
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. デバッグ版APKをビルドする
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 5. GitHubの「Releases」に自動でデバッグAPKをアップロードする
      - name: Release Debug APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: Debug Build #${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}